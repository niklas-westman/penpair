name: Release version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penpair-version-pr
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' && vars.PENPAIR_RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - name: Require a scoped PR token so release PR checks run automatically
        env:
          CHANGESETS_PR_TOKEN: ${{ secrets.CHANGESETS_PR_TOKEN }}
        run: test -n "$CHANGESETS_PR_TOKEN" || { echo 'Configure CHANGESETS_PR_TOKEN before enabling release PRs'; exit 1; }
      - name: Maintain the reviewed version PR (never publish here)
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          github-token: ${{ secrets.CHANGESETS_PR_TOKEN }}
          version: pnpm version-packages
          title: Release Penpair
          commit: 'chore: version Penpair packages'
          commitMode: github-api
          createGithubReleases: false

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Typecheck, test, build, package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        run: pnpm check

      - name: Validate pending Changesets release notes
        run: pnpm changeset status

      - name: Require release notes or verify the version PR
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-changeset.mjs
        env:
          PENPAIR_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PENPAIR_PR_HEAD: ${{ github.head_ref }}

      - name: Pack all packages, install them in empty projects and run them
        run: pnpm smoke:package

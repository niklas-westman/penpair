name: Publish reviewed Penpair release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version already committed and reviewed on main
        required: true
        type: string
      continue_release:
        description: Resume an independently inspected interrupted release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: penpair-package-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main' && vars.PENPAIR_TRUSTED_RELEASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || vars.PENPAIR_RELEASE_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.review.outputs.publish }}
      version: ${{ steps.review.outputs.version }}
      release_pr: ${{ steps.review.outputs.release_pr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify the exact merged version PR or explicit manual release
        id: review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const gate = require('./scripts/release-gate.cjs');
            await gate({ github, context, core });

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a moved main branch
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Recheck guards, pack and publish the full family with OIDC
        run: node scripts/ci-release.mjs
        env:
          PENPAIR_EXPECTED_VERSION: ${{ needs.gate.outputs.version }}
          PENPAIR_CONTINUE_RELEASE: ${{ inputs.continue_release || 'false' }}
          PENPAIR_RELEASE_PR: ${{ needs.gate.outputs.release_pr }}
          PENPAIR_RELEASE_ENVIRONMENT: npm-release
          PENPAIR_RELEASE_EXCLUDE_PENPAIR: ${{ vars.PENPAIR_RELEASE_EXCLUDE_PENPAIR }}
